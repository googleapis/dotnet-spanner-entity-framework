name: Release NuGet Packages via OSS Exit Gate

on:
  push:
    tags:
      - 'Google.Cloud.EntityFrameworkCore.Spanner-*'
      - 'Google.Cloud.Spanner.DataProvider-*'
  workflow_dispatch:
    inputs:
      component:
        description: 'Package component to build and publish'
        required: true
        type: choice
        options:
          - Google.Cloud.EntityFrameworkCore.Spanner
          - Google.Cloud.Spanner.DataProvider

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'

      - name: Checkout go-sql-spanner
        if: startsWith(github.ref_name, 'Google.Cloud.Spanner.DataProvider-') || inputs.component == 'Google.Cloud.Spanner.DataProvider'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'googleapis/go-sql-spanner'
          path: spanner-ado-net/spanner-ado-net/go-sql-spanner
          persist-credentials: false

      - name: Determine target OSS Exit Gate project
        id: target
        shell: bash
        env:
          INPUT_COMPONENT: ${{ inputs.component }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == Google.Cloud.Spanner.DataProvider-* || "$INPUT_COMPONENT" == "Google.Cloud.Spanner.DataProvider" ]]; then
            echo "component=Google.Cloud.Spanner.DataProvider" >> "$GITHUB_OUTPUT"
            echo "project_id=spanner-dataprovider" >> "$GITHUB_OUTPUT"
            echo "ar_repo=spanner-dataprovider--nuget" >> "$GITHUB_OUTPUT"
          else
            echo "component=Google.Cloud.EntityFrameworkCore.Spanner" >> "$GITHUB_OUTPUT"
            echo "project_id=dotnet-spanner-ef" >> "$GITHUB_OUTPUT"
            echo "ar_repo=dotnet-spanner-ef--nuget" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Clean up stale releases from staging repo
        shell: bash
        env:
          AR_REPO: ${{ steps.target.outputs.ar_repo }}
        run: |
          # clean up stale releases from staging repo
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="${AR_REPO}" \
              --format="value(name)" 2>/dev/null)

          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="'"${AR_REPO}"'" \
                  --quiet
          '

      - name: Build, pack, and stage NuGet package to OSS Exit Gate
        shell: bash
        env:
          COMPONENT: ${{ steps.target.outputs.component }}
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          AR_REPO: ${{ steps.target.outputs.ar_repo }}
        run: |
          shopt -s nullglob
          ./build.sh "${COMPONENT}"
          for nupkg in nupkg/*.nupkg; do
            [[ "$nupkg" == *.symbols.nupkg ]] && continue
            base="$(basename "$nupkg" .nupkg)"
            ver="$(echo "$base" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$')"
            pkg_id="${base%.$ver}"
            pkg_lower="$(echo "$pkg_id" | tr '[:upper:]' '[:lower:]')"
            gcloud artifacts generic upload \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="${AR_REPO}" \
              --package="${pkg_lower}" \
              --version="${ver}" \
              --source="${nupkg}"
          done
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/${PROJECT_ID}/nuget/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
