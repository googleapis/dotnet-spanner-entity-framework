name: Release Spanner EntityFrameworkCore and DataProvider NuGet via OSS Exit Gate

on:
  push:
    tags:
      - 'Google.Cloud.EntityFrameworkCore.Spanner-*'
      - 'Google.Cloud.Spanner.DataProvider-*'
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Build and stage Spanner NuGet packages to OSS Exit Gate
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          if [[ "$REF_NAME" == Google.Cloud.Spanner.DataProvider-* ]]; then
            ./build.sh Google.Cloud.Spanner.DataProvider
            REPO="spanner-dataprovider--nuget"
            PROJ="spanner-dataprovider"
          else
            ./build.sh Google.Cloud.EntityFrameworkCore.Spanner
            REPO="dotnet-spanner-ef--nuget"
            PROJ="dotnet-spanner-ef"
          fi
          for nupkg in nupkg/*.nupkg; do
            [[ "$nupkg" == *.symbols.nupkg ]] && continue
            base="$(basename "$nupkg" .nupkg)"
            ver="$(echo "$base" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$')"
            pkg_id="${base%.$ver}"
            pkg_lower="$(echo "$pkg_id" | tr '[:upper:]' '[:lower:]')"
            gcloud artifacts generic upload \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository="${REPO}" \
              --package="${pkg_lower}" \
              --version="${ver}" \
              --source="${nupkg}"
          done
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/${PROJ}/nuget/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
